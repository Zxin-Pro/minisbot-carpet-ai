pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.180'
}

rootProject.name = 'minisbot-carpet-ai'
